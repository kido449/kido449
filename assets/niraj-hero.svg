<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="nirajHeroTitle nirajHeroDesc">
  <title id="nirajHeroTitle">Niraj Damai</title>
  <desc id="nirajHeroDesc">AI/ML Engineer, Full-Stack Developer, Creative Technologist. A burgundy technical portrait with a moving orbital line and luminous accents.</desc>
  <defs>
    <linearGradient id="nirajHeroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.58" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="nirajHeroGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.48" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D"/>
      <animate attributeName="x1" values="-0.4;0.4;-0.4" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.6;1.4;0.6" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="nirajHeroHalo" cx="78%" cy="47%" r="58%">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="nirajHeroGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="nirajHeroBlur" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <mask id="nirajHeroGridFade">
      <rect width="1200" height="430" fill="url(#nirajHeroMask)"/>
    </mask>
    <linearGradient id="nirajHeroMask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0.1"/>
      <stop offset="0.52" stop-color="white" stop-opacity="0.8"/>
      <stop offset="1" stop-color="white" stop-opacity="0.32"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="430" rx="8" fill="url(#nirajHeroBg)"/>
  <rect width="1200" height="430" rx="8" fill="url(#nirajHeroHalo)"/>
  <rect width="1200" height="430" rx="8" fill="url(#nirajHeroGrid)" mask="url(#nirajHeroGridFade)"/>
  <path d="M0 354H1200" stroke="#E5B5C7" stroke-opacity="0.13"/>
  <path d="M0 362H1200" stroke="#E5B5C7" stroke-opacity="0.07"/>
  <g fill="none" stroke="#E5B5C7" stroke-opacity="0.34">
    <ellipse cx="965" cy="205" rx="170" ry="64" transform="rotate(-27 965 205)"/>
    <ellipse cx="965" cy="205" rx="170" ry="64" transform="rotate(27 965 205)"/>
    <circle cx="965" cy="205" r="112" stroke-opacity="0.12"/>
  </g>
  <circle cx="1105" cy="131" r="4" fill="#E5B5C7">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="828" cy="258" r="3" fill="#C77B9B"/>
  <path d="M736 260 C810 158 866 302 936 195 S1064 128 1150 219" fill="none" stroke="url(#nirajHeroGlow)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="10 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="8s" repeatCount="indefinite"/>
  </path>
  <text x="82" y="92" fill="#E5B5C7" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="3">ENGINEERING / INTELLIGENCE / DESIGN</text>
  <path d="M82 112H178" stroke="#701A3D" stroke-width="2"/>
  <text x="78" y="218" fill="#F8F0F3" font-family="Georgia, 'Times New Roman', serif" font-size="76">Niraj Damai</text>
  <text x="82" y="266" fill="#E5B5C7" font-family="Segoe UI, Arial, sans-serif" font-size="19">AI/ML Engineer  <tspan fill="#C77B9B">|</tspan>  Full-Stack Developer</text>
  <text x="82" y="296" fill="#E5B5C7" font-family="Segoe UI, Arial, sans-serif" font-size="19">Creative Technologist</text>
  <path d="M82 324H560" stroke="#701A3D" stroke-width="8" opacity="0.48" filter="url(#nirajHeroBlur)"/>
  <path d="M82 324H560" stroke="url(#nirajHeroGlow)" stroke-width="2" stroke-linecap="round"/>
  <text x="82" y="390" fill="#C77B9B" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.2">BUILDING SYSTEMS THAT THINK, SERVE &amp; FEEL CONSIDERED</text>
</svg>