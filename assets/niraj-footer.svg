<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-labelledby="nirajFooterTitle nirajFooterDesc">
  <title id="nirajFooterTitle">Burgundy orbital line</title>
  <desc id="nirajFooterDesc">A minimal animated rose line and orbit on a midnight background.</desc>
  <defs>
    <linearGradient id="nirajFooterGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#451126"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D"/>
      <animate attributeName="x1" values="-0.3;0.3;-0.3" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.7;1.3;0.7" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="92" rx="6" fill="#10070C"/>
  <path d="M0 46H475 C520 46 535 22 565 22 C595 22 605 70 635 70 C665 70 680 46 725 46H1200" fill="none" stroke="url(#nirajFooterGradient)" stroke-width="1.5" stroke-dasharray="7 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="8s" repeatCount="indefinite"/>
  </path>
  <ellipse cx="600" cy="46" rx="62" ry="20" fill="none" stroke="#C77B9B" stroke-opacity="0.45"/>
  <circle cx="600" cy="46" r="3" fill="#F8F0F3">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>